# ops/project.conf: what the pack, the pipeline and the server need to know about this project.
# KEY=value lines, parsed (never sourced). A value may be wrapped in double quotes.
# /team:new-project fills the empty values. Keys and meanings: dev-standards docs/rules.md section 7.
# Changing this file is a guarded change (it waits for the owner's yes).

# Project name: lowercase letters, digits and dashes, 2-21 chars, starting with a letter (e.g. sandbox-app)
PROJECT_NAME=

# GitHub account that owns the repo (team-gh acts as this login) and that account's SSH host alias
GITHUB_ACCOUNT=
GITHUB_SSH_HOST=
# owner/name
GITHUB_REPO=
# public | private (private switches the project to the private fallback)
VISIBILITY=public

# Database engine: postgres | mysql | mariadb | none
DB_ENGINE=
# How the server serves the app: proxy (app listens on $PORT) | php-fpm | static
WEB_MODE=

# Health endpoint: must return 200 without auth (deploys and uptime check it)
HEALTH_PATH=/health
# Run in the release folder with the env file loaded, on every deploy, before the switch
MIGRATE_CMD=make migrate
# Loads fake seed data into a new worktree database while no sanitized snapshot exists
SEED_CMD=make seed
# Space-separated globs for migration files (PII guard, destructive-migration check), e.g. db/migrations/**
MIGRATIONS_GLOB=
# Space-separated globs that add the high-risk label (auth, payments, uploads), e.g. src/auth/** src/payments/**
HIGH_RISK_GLOBS=

# IANA timezone of the project's users and client, e.g. Asia/Manila or America/New_York
PROJECT_TIMEZONE=
# Hour (0-23, in PROJECT_TIMEZONE) for nightly snapshot and backup jobs
LOW_TRAFFIC_HOUR=3

# Worktree env file name
ENV_FILE=.env
# make build fills this folder with exactly the release (plus ops/ is added by the pipeline)
ARTIFACT_DIR=.team/artifact
# Space-separated release paths symlinked to shared/ on the server (uploads, storage), e.g. storage
SHARED_PATHS=
# Web root inside the release, for static and php-fpm modes, e.g. public
STATIC_ROOT=

# MySQL/MariaDB only: the worktree database container image and its host port, e.g. mysql:8.4 and 5440
LOCAL_DB_IMAGE=
LOCAL_DB_PORT=
