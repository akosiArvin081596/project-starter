# ops/services.conf: the long-running processes of this app, one per line.
# team-provision turns each line into a systemd unit team-<project>-<env>-<name>.service,
# run as the environment's own OS user from the current release with its env file loaded.
#
# Format: name|type|command
#   name     lowercase letters, digits and dashes (part of the unit name)
#   type     web | worker | scheduler
#   command  run from the release folder by a shell
#
# The web process must listen on $PORT (the server assigns it). Static sites need no line.
# Scheduled jobs run in PROJECT_TIMEZONE (ops/project.conf); store their times in UTC.
#
# Example (replace with the commands for your stack; /team:new-project fills this in):
# web|web|./bin/server --port "$PORT"
# worker|worker|./bin/worker
# scheduler|scheduler|./bin/scheduler
